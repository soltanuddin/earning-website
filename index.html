<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EarnX - Earn More. Live Smarter.</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:Arial,sans-serif;
  background:#050b16;
  color:#fff;
  line-height:1.5;
}

button,input,select{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}

.container{
  width:min(1100px,92%);
  margin:auto;
}

header{
  position:sticky;
  top:0;
  z-index:100;
  background:rgba(5,11,22,.88);
  backdrop-filter:blur(18px);
  border-bottom:1px solid rgba(255,255,255,.08);
}

.nav{
  min-height:70px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  font-size:27px;
  font-weight:900;
  letter-spacing:-1px;
  color:#35e58c;
}

.logo span{color:#fff}

.nav-buttons{
  display:flex;
  gap:8px;
}

.btn{
  border:0;
  border-radius:12px;
  padding:11px 17px;
  font-weight:800;
}

.btn-primary{
  background:#35e58c;
  color:#04130b;
  box-shadow:0 8px 25px rgba(53,229,140,.18);
}

.btn-dark{
  background:#121e31;
  color:#fff;
  border:1px solid rgba(255,255,255,.08);
}

.hero{
  position:relative;
  overflow:hidden;
  padding:85px 0 55px;
  text-align:center;
}

.hero:before{
  content:"";
  position:absolute;
  width:420px;
  height:420px;
  background:#35e58c;
  opacity:.08;
  filter:blur(100px);
  border-radius:50%;
  top:-180px;
  left:50%;
  transform:translateX(-50%);
}

.badge{
  position:relative;
  display:inline-block;
  padding:8px 15px;
  border-radius:30px;
  background:rgba(53,229,140,.09);
  border:1px solid rgba(53,229,140,.25);
  color:#35e58c;
  font-size:13px;
  font-weight:800;
}

.hero h1{
  position:relative;
  font-size:clamp(42px,8vw,76px);
  line-height:1.02;
  margin:22px 0 16px;
  letter-spacing:-2px;
}

.hero h1 span{color:#35e58c}

.hero p{
  position:relative;
  color:#93a3b8;
  max-width:650px;
  margin:auto;
  font-size:16px;
}

.hero-actions{
  position:relative;
  display:flex;
  justify-content:center;
  gap:12px;
  margin-top:28px;
  flex-wrap:wrap;
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:15px;
  margin:30px 0 15px;
}

.stat{
  background:linear-gradient(145deg,#0c1728,#091322);
  border:1px solid rgba(255,255,255,.07);
  padding:20px;
  border-radius:20px;
  text-align:center;
}

.stat strong{
  display:block;
  color:#35e58c;
  font-size:27px;
}

.stat span{
  color:#8998ad;
  font-size:13px;
}

section{padding:50px 0}

.section-title{
  text-align:center;
  margin-bottom:28px;
}

.section-title h2{
  font-size:31px;
  margin-bottom:6px;
}

.section-title p{color:#8998ad}

.earning-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
}

.earning-card{
  background:linear-gradient(145deg,#0d1a2b,#091423);
  border:1px solid rgba(255,255,255,.08);
  border-radius:23px;
  padding:23px 16px;
  text-align:center;
}

.earning-icon{
  width:70px;
  height:70px;
  border-radius:20px;
  margin:0 auto 15px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.earning-icon svg{
  width:40px;
  height:40px;
}

.youtube-bg{background:#ff0000}
.telegram-bg{background:#229ed9}
.tiktok-bg{background:#111}
.website-bg{background:#2563eb}
.app-bg{background:#7c3aed}
.referral-bg{background:#ec4899}
.bonus-bg{background:#f59e0b}

.earning-card h3{
  font-size:17px;
  margin-bottom:5px;
}

.earning-card p{
  color:#8998ad;
  font-size:12px;
  min-height:38px;
}

.earning-tag{
  display:inline-block;
  margin-top:12px;
  padding:5px 9px;
  border-radius:20px;
  background:rgba(53,229,140,.09);
  color:#35e58c;
  font-size:11px;
  font-weight:800;
}

.how-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:15px;
}

.how-card{
  background:#0c1829;
  border:1px solid rgba(255,255,255,.07);
  border-radius:20px;
  padding:25px;
}

.how-number{
  width:45px;
  height:45px;
  border-radius:14px;
  background:#35e58c;
  color:#06120c;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:900;
  margin-bottom:15px;
}

.how-card p{
  color:#8998ad;
  margin-top:5px;
}

.cta{
  background:
    radial-gradient(circle at 50% 0,rgba(53,229,140,.15),transparent 50%),
    #0b1727;
  border:1px solid rgba(53,229,140,.15);
  border-radius:28px;
  padding:45px 25px;
  text-align:center;
}

.cta h2{
  font-size:34px;
  margin-bottom:8px;
}

.cta p{
  color:#8998ad;
  margin-bottom:22px;
}

.auth-box{
  max-width:460px;
  margin:35px auto;
  background:#0d1a2b;
  border:1px solid rgba(255,255,255,.08);
  border-radius:24px;
  padding:25px;
}

.auth-box h2{margin-bottom:18px}

.input{
  width:100%;
  padding:13px;
  border-radius:12px;
  border:1px solid #25364d;
  background:#081524;
  color:#fff;
  margin-bottom:12px;
  outline:none;
}

.input:focus{border-color:#35e58c}

.auth-box .btn{width:100%}

.dashboard{padding-top:25px}

.balance-card{
  background:linear-gradient(135deg,#0f3b2a,#0d1a2b);
  border:1px solid rgba(53,229,140,.2);
  border-radius:25px;
  padding:28px;
}

.balance-label{color:#9eb1c7}

.balance{
  font-size:42px;
  font-weight:900;
  color:#35e58c;
  margin:5px 0;
}

.user-name{color:#fff}

.dash-stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
  margin-top:15px;
}

.dash-stat{
  background:#0d1a2b;
  border:1px solid rgba(255,255,255,.07);
  border-radius:18px;
  padding:18px;
}

.dash-stat small{color:#8d9db1}

.dash-stat strong{
  display:block;
  margin-top:5px;
  font-size:21px;
}

.bonus-card{
  background:#0d1a2b;
  border:1px solid rgba(255,255,255,.07);
  border-radius:20px;
  padding:22px;
  margin-bottom:25px;
}

.bonus-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
}

.task-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:15px;
}

.task-card{
  background:#0d1a2b;
  border:1px solid rgba(255,255,255,.08);
  border-radius:20px;
  padding:18px 12px;
  text-align:center;
}

.task-icon{
  width:62px;
  height:62px;
  border-radius:18px;
  margin:0 auto 12px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.telegram-icon{background:#229ed9}
.youtube-icon{background:#ff0000}
.tiktok-icon{background:#111}
.website-icon{background:#2563eb}

.task-card h3{
  font-size:16px;
  margin-bottom:4px;
}

.task-card p{
  color:#8e9eb2;
  font-size:12px;
  min-height:36px;
}

.task-reward{
  display:block;
  color:#35e58c;
  font-weight:800;
  margin:10px 0;
}

.task-card button{
  width:100%;
  border:0;
  border-radius:11px;
  padding:10px 5px;
  background:#35e58c;
  color:#06120c;
  font-weight:800;
}

.referral-card{
  background:#0d1a2b;
  border:1px solid rgba(255,255,255,.07);
  border-radius:20px;
  padding:22px;
}

.referral-code{
  display:flex;
  gap:8px;
  margin-top:12px;
}

.referral-code input{
  flex:1;
  margin:0;
}

.transactions{
  background:#0d1a2b;
  border:1px solid rgba(255,255,255,.07);
  border-radius:20px;
  padding:20px;
}

.transaction{
  display:flex;
  justify-content:space-between;
  padding:13px 0;
  border-bottom:1px solid rgba(255,255,255,.06);
}

.transaction:last-child{border-bottom:0}

.positive{color:#35e58c}
.negative{color:#ff6b6b}

.empty{
  text-align:center;
  color:#8291a5;
  padding:20px;
}

footer{
  margin-top:45px;
  padding:30px 0;
  border-top:1px solid rgba(255,255,255,.07);
  text-align:center;
  color:#77879c;
}

@media(max-width:800px){
  .earning-grid{grid-template-columns:repeat(2,1fr)}
  .how-grid{grid-template-columns:1fr}
}

@media(max-width:700px){

  .nav{min-height:62px}

  .logo{font-size:21px}

  .nav-buttons .btn{
    padding:8px 10px;
    font-size:12px;
  }

  .hero{padding:60px 0 30px}

  .hero h1{font-size:45px}

  .hero p{font-size:14px}

  .stats{
    grid-template-columns:repeat(3,1fr);
    gap:8px;
  }

  .stat{
    padding:14px 5px;
    border-radius:15px;
  }

  .stat strong{font-size:20px}
  .stat span{font-size:10px}

  .earning-grid{
    grid-template-columns:repeat(2,1fr);
    gap:10px;
  }

  .earning-card{
    padding:17px 8px;
    border-radius:18px;
  }

  .earning-icon{
    width:55px;
    height:55px;
    border-radius:16px;
  }

  .earning-icon svg{
    width:31px;
    height:31px;
  }

  .earning-card h3{font-size:13px}

  .earning-card p{
    font-size:10px;
    min-height:31px;
  }

  .earning-tag{
    font-size:9px;
    margin-top:8px;
  }

  .dash-stats{
    grid-template-columns:repeat(3,1fr);
  }

  .dash-stat{
    padding:12px 6px;
    text-align:center;
  }

  .dash-stat strong{font-size:16px}
  .dash-stat small{font-size:10px}

  .task-grid{
    grid-template-columns:repeat(3,1fr);
    gap:8px;
  }

  .task-card{
    padding:12px 5px;
    border-radius:15px;
  }

  .task-icon{
    width:48px;
    height:48px;
    border-radius:14px;
  }

  .task-card h3{font-size:11px}

  .task-card p{
    font-size:9px;
    min-height:32px;
  }

  .task-reward{
    font-size:11px;
    margin:7px 0;
  }

  .task-card button{
    font-size:9px;
    padding:8px 2px;
  }

  .balance{font-size:35px}

  .bonus-row{
    align-items:flex-start;
    flex-direction:column;
  }

  .cta{
    padding:35px 18px;
  }

  .cta h2{font-size:27
