<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EarnX — Earn Online</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#f5f7fb;
  color:#172033;
}

button,input,select{
  font:inherit;
}

button{
  cursor:pointer;
}

a{
  text-decoration:none;
  color:inherit;
}

/* HEADER */
header{
  position:sticky;
  top:0;
  z-index:1000;
  background:rgba(255,255,255,.96);
  border-bottom:1px solid #e9edf4;
  backdrop-filter:blur(12px);
}

.nav{
  max-width:1150px;
  margin:auto;
  min-height:70px;
  padding:0 18px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
}

.logo{
  display:flex;
  align-items:center;
  gap:10px;
  font-size:23px;
  font-weight:800;
}

.logo-icon{
  width:42px;
  height:42px;
  border-radius:13px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#fff;
  background:linear-gradient(135deg,#6c5ce7,#00b894);
  box-shadow:0 8px 20px rgba(108,92,231,.25);
}

.logo span{
  background:linear-gradient(90deg,#6c5ce7,#00a884);
  -webkit-background-clip:text;
  color:transparent;
}

.nav-links{
  display:flex;
  align-items:center;
  gap:8px;
}

.nav-links button{
  border:0;
  background:transparent;
  padding:10px 13px;
  border-radius:10px;
  color:#596579;
  font-weight:600;
}

.nav-links button:hover{
  background:#f0f2ff;
  color:#5b4bd8;
}

/* PAGES */
.page{
  display:none;
}

.page.active{
  display:block;
}

/* HERO */
.hero{
  max-width:1150px;
  margin:auto;
  padding:65px 18px 35px;
  display:grid;
  grid-template-columns:1.15fr .85fr;
  gap:35px;
  align-items:center;
}

.badge{
  display:inline-flex;
  padding:8px 13px;
  border-radius:30px;
  background:#eeecff;
  color:#5c4bd8;
  font-weight:700;
  font-size:13px;
  margin-bottom:18px;
}

.hero h1{
  font-size:52px;
  line-height:1.05;
  margin-bottom:18px;
}

.hero h1 span{
  background:linear-gradient(90deg,#6c5ce7,#00b894);
  -webkit-background-clip:text;
  color:transparent;
}

.hero p{
  color:#697386;
  font-size:17px;
  line-height:1.7;
  max-width:600px;
}

.hero-buttons{
  display:flex;
  gap:12px;
  margin-top:28px;
}

.primary-btn,
.secondary-btn{
  border:0;
  padding:13px 20px;
  border-radius:13px;
  font-weight:700;
}

.primary-btn{
  color:#fff;
  background:linear-gradient(135deg,#6c5ce7,#00b894);
  box-shadow:0 10px 25px rgba(108,92,231,.22);
}

.secondary-btn{
  background:#fff;
  border:1px solid #e2e6ee;
}

/* HERO CARD */
.hero-card{
  background:#fff;
  border:1px solid #e8ebf2;
  border-radius:27px;
  padding:25px;
  box-shadow:0 20px 55px rgba(32,45,70,.10);
}

.balance-box{
  padding:25px;
  border-radius:22px;
  color:#fff;
  background:linear-gradient(135deg,#171c38,#5c4bd8);
}

.balance-label{
  opacity:.8;
  font-size:13px;
}

.balance{
  font-size:37px;
  font-weight:800;
  margin:8px 0 18px;
}

.mini-stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}

.mini-stat{
  background:rgba(255,255,255,.12);
  padding:12px;
  border-radius:13px;
}

.mini-stat b{
  display:block;
  font-size:17px;
}

.mini-stat span{
  font-size:10px;
  opacity:.7;
}

/* FEATURES */
.container{
  max-width:1150px;
  margin:auto;
  padding:20px 18px 50px;
}

.section-heading{
  text-align:center;
  margin:35px 0 25px;
}

.section-heading h2{
  font-size:30px;
  margin-bottom:8px;
}

.section-heading p{
  color:#7a8495;
}

.feature-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
}

.feature{
  background:#fff;
  border:1px solid #e8ebf2;
  border-radius:19px;
  padding:20px;
}

.feature-icon{
  width:45px;
  height:45px;
  border-radius:13px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#f0efff;
  font-size:21px;
  margin-bottom:13px;
}

.feature h3{
  font-size:15px;
  margin-bottom:6px;
}

.feature p{
  color:#7b8494;
  font-size:12px;
  line-height:1.5;
}

/* TASKS */
.task-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:16px;
}

.task-card{
  background:#fff;
  border:1px solid #e6eaf1;
  border-radius:21px;
  padding:18px;
  display:flex;
  gap:15px;
  box-shadow:0 7px 25px rgba(25,35,55,.05);
}

.task-icon{
  min-width:55px;
  height:55px;
  border-radius:17px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:25px;
  font-weight:bold;
}

.telegram .task-icon{
  background:#e4f4ff;
}

.tiktok .task-icon{
  background:#f0f0f0;
}

.youtube .task-icon{
  background:#ffe7e7;
}

.website .task-icon{
  background:#e7faf2;
}

.task-content{
  flex:1;
}

.task-content h3{
  font-size:16px;
  margin-bottom:5px;
}

.task-content p{
  font-size:12px;
  color:#7d8797;
  margin-bottom:13px;
}

.task-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
}

.reward{
  color:#16a05d;
  font-weight:800;
}

.task-btn{
  border:0;
  background:#171c38;
  color:#fff;
  border-radius:10px;
  padding:9px 13px;
  font-size:12px;
  font-weight:700;
}

/* AUTH */
.auth-wrap{
  min-height:calc(100vh - 70px);
  display:flex;
  justify-content:center;
  align-items:center;
  padding:30px 18px;
}

.auth-card{
  width:100%;
  max-width:430px;
  background:#fff;
  border:1px solid #e7eaf0;
  border-radius:24px;
  padding:28px;
  box-shadow:0 20px 55px rgba(25,35,55,.09);
}

.auth-card h2{
  margin-bottom:7px;
}

.auth-card > p{
  color:#7c8595;
  font-size:13px;
  margin-bottom:22px;
}

.input-group{
  margin-bottom:14px;
}

.input-group label{
  display:block;
  font-size:12px;
  font-weight:700;
  margin-bottom:6px;
}

.input-group input,
.input-group select{
  width:100%;
  border:1px solid #dfe4ec;
  background:#fafbfc;
  border-radius:11px;
  padding:12px;
  outline:none;
}

.input-group input:focus,
.input-group select:focus{
  border-color:#6c5ce7;
}

.full-btn{
  width:100%;
  border:0;
  padding:13px;
  border-radius:12px;
  color:#fff;
  background:linear-gradient(135deg,#6c5ce7,#00a884);
  font-weight:800;
}

.switch{
  text-align:center;
  margin-top:16px;
  font-size:13px;
  color:#737d8d;
}

.switch button{
  border:0;
  background:none;
  color:#5b4bd8;
  font-weight:800;
}

/* DASHBOARD */
.dashboard{
  max-width:1150px;
  margin:auto;
  padding:30px 18px 60px;
}

.dashboard-top{
  margin-bottom:22px;
}

.dashboard-top h1{
  font-size:30px;
}

.dashboard-top p{
  color:#778193;
  margin-top:5px;
}

.stats-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:14px;
  margin-bottom:20px;
}

.stat-card{
  background:#fff;
  border:1px solid #e7eaf1;
  border-radius:18px;
  padding:19px;
}

.stat-card .stat-icon{
  font-size:22px;
  margin-bottom:10px;
}

.stat-card small{
  color:#7e8797;
  display:block;
  margin-bottom:5px;
}

.stat-card strong{
  font-size:23px;
}

/* BONUS */
.bonus-card{
  color:#fff;
  background:linear-gradient(135deg,#171c38,#6c5ce7);
  border-radius:22px;
  padding:23px;
  margin-bottom:22px;
}

.bonus-card h2{
  margin-bottom:7px;
}

.bonus-card p{
  opacity:.75;
  font-size:13px;
  margin-bottom:18px;
}

.bonus-btn{
  border:0;
  background:#fff;
  color:#4d3fc2;
  padding:11px 16px;
  border-radius:11px;
  font-weight:800;
}

/* PANELS */
.panel{
  background:#fff;
  border:1px solid #e7eaf1;
  border-radius:21px;
  padding:21px;
  margin-bottom:20px;
}

.panel h2{
  margin-bottom:17px;
  font-size:20px;
}

.referral-box{
  display:flex;
  gap:10px;
}

.referral-box input{
  flex:1;
  border:1px solid #e1e5ed;
  background:#f8f9fb;
  padding:11px;
  border-radius:10px;
}

.referral-box button{
  border:0;
  background:#171c38;
  color:#fff;
  padding:0 15px;
  border-radius:10px;
}

/* TRANSACTIONS */
.transaction{
  display:flex;
  justify-content:space-between;
  gap:12px;
  padding:13px 0;
  border-bottom:1px solid #edf0f4;
}

.transaction:last-child{
  border-bottom:0;
}

.transaction small{
  display:block;
  color:#8992a1;
  margin-top:4px;
}

.plus{
  color:#15985a;
  font-weight:800;
}

.minus{
  color:#e04d4d;
  font-weight:800;
}

/* ADMIN */
.admin-wrap{
  max-width:1150px;
  margin:auto;
  padding:30px 18px 60px;
}

.admin-header{
  margin-bottom:20px;
}

.admin-header h1{
  font-size:30px;
}

.admin-header p{
  color:#7a8494;
  margin-top:5px;
}

.admin-stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:14px;
  margin-bottom:20px;
}

.admin-table{
  width:100%;
  border-collapse:collapse;
  font-size:13px;
}

.admin-table th,
.admin-table td{
  text-align:left;
  padding:12px 8px;
  border-bottom:1px solid #edf0f4;
}

.action-btn{
  border:0;
  padding:7px 10px;
  border-radius:8px;
  font-size:11px;
  font-weight:700;
}

.approve{
  background:#dcf8e9;
  color:#12824a;
}

.reject{
  background:#ffe5e5;
  color:#c63d3d;
}

/* ALERT */
#alert{
  position:fixed;
  right:18px;
  bottom:18px;
  z-index:5000;
  max-width:320px;
  display:none;
  background:#171c38;
  color:#fff;
  padding:13px 16px;
  border-radius:12px;
  box-shadow:0 12px 35px rgba(0,0,0,.2);
  font-size:13px;
}

/* FOOTER */
footer{
  text-align:center;
  padding:28px 18px;
  border-top:1px solid #e8ebf0;
  color:#8992a1;
  font-size:12px;
}

/* MOBILE */
@media(max-width:800px){

  .hero{
    grid-template-columns:1fr;
    padding-top:40px;
  }

  .hero h1{
    font-size:39px;
  }

  .feature-grid,
  .stats-grid,
  .admin-stats{
    grid-template-columns:repeat(2,1fr);
  }

  .nav-links button{
    padding:8px;
    font-size:11px;
  }
}

@media(max-width:600px){

  .nav{
    min-height:62px;
  }

  .logo{
    font-size:19px;
  }

  .logo-icon{
    width:36px;
    height:36px;
  }

  .nav-links{
    gap:2px;
  }

  .nav-links button{
    padding:7px 6px;
    font-size:10px;
  }

  .hero{
    padding-top:32px;
  }

  .hero h1{
    font-size:35px;
  }

  .hero p{
    font-size:14px;
  }

  .hero-buttons{
    flex-direction:column;
  }

  .feature-grid,
  .task-grid,
  .stats-grid,
  .admin-stats{
    grid-template-columns:1fr;
  }

  .task-card{
    padding:15px;
  }

  .admin-table{
    min-width:700px;
  }

  .panel{
    overflow-x:auto;
  }

  .referral-box{
    flex-direction:column;
  }

  .referral-box button{
    padding:11px;
  }
}
</style>
</head>

<body>

<header>
  <div class="nav">

    <button class="logo" onclick="showPage('home')" style="border:0;background:none;">
      <div
