<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>EarnX - Earn Online</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#f5f7fb;
  color:#172033;
}

button,input,select{
  font-family:inherit;
}

header{
  background:#fff;
  border-bottom:1px solid #e6e9f0;
  position:sticky;
  top:0;
  z-index:100;
}

.nav{
  max-width:1150px;
  margin:auto;
  padding:15px 20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  font-size:26px;
  font-weight:900;
  color:#5b4bff;
}

.nav-links{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.nav-links button{
  background:transparent;
  border:0;
  padding:9px 12px;
  border-radius:9px;
  cursor:pointer;
  color:#344054;
  font-weight:600;
}

.nav-links button:hover{
  background:#f0f1ff;
  color:#5b4bff;
}

.container{
  max-width:1150px;
  margin:auto;
  padding:25px 20px;
}

.page{
  display:none;
}

.page.active{
  display:block;
}

.hero{
  margin-top:10px;
  background:linear-gradient(135deg,#fff,#eef0ff);
  border:1px solid #e1e4ff;
  border-radius:25px;
  padding:55px 25px;
  text-align:center;
  box-shadow:0 15px 40px rgba(40,45,100,.07);
}

.hero h1{
  font-size:42px;
  margin-bottom:15px;
}

.hero h1 span{
  color:#5b4bff;
}

.hero p{
  max-width:680px;
  margin:auto;
  color:#667085;
  line-height:1.7;
}

.btn{
  border:0;
  background:#5b4bff;
  color:white;
  padding:12px 20px;
  border-radius:11px;
  cursor:pointer;
  font-weight:700;
  margin-top:20px;
}

.btn:hover{
  opacity:.9;
}

.section-title{
  text-align:center;
  margin:38px 0 22px;
  font-size:28px;
}

.features{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
}

.card{
  background:#fff;
  border:1px solid #e5e8ef;
  border-radius:18px;
  padding:22px;
  box-shadow:0 8px 25px rgba(30,40,80,.05);
}

.feature{
  text-align:center;
}

.feature-icon{
  font-size:32px;
  margin-bottom:10px;
}

.feature p{
  color:#667085;
  font-size:14px;
  margin-top:7px;
  line-height:1.5;
}

.tasks{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:15px;
}

.task{
  background:#fff;
  border:1px solid #e5e8ef;
  border-radius:18px;
  padding:18px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  box-shadow:0 8px 25px rgba(30,40,80,.05);
}

.task-left{
  display:flex;
  align-items:center;
  gap:13px;
}

.task-icon{
  width:52px;
  height:52px;
  border-radius:15px;
  background:#f0f1ff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:27px;
  flex-shrink:0;
}

.task h3{
  font-size:16px;
  margin-bottom:5px;
}

.task p{
  font-size:13px;
  color:#667085;
}

.reward{
  color:#16a34a;
  font-weight:800;
  margin-bottom:7px;
  text-align:right;
}

.small-btn{
  background:#5b4bff;
  color:#fff;
  border:0;
  border-radius:8px;
  padding:8px 12px;
  cursor:pointer;
  font-weight:700;
}

.auth-box{
  max-width:480px;
  margin:30px auto;
}

.auth-box h2{
  text-align:center;
  margin-bottom:20px;
}

.form-group{
  margin-bottom:14px;
}

.form-group label{
  display:block;
  margin-bottom:6px;
  font-size:14px;
  font-weight:700;
}

.form-group input,
.form-group select{
  width:100%;
  padding:12px;
  border:1px solid #dfe3eb;
  border-radius:10px;
  outline:none;
  background:#fff;
}

.form-group input:focus,
.form-group select:focus{
  border-color:#5b4bff;
}

.full-btn{
  width:100%;
  margin-top:5px;
}

.switch{
  text-align:center;
  margin-top:15px;
  color:#667085;
  font-size:14px;
}

.switch button{
  border:0;
  background:none;
  color:#5b4bff;
  cursor:pointer;
  font-weight:700;
}

.dashboard-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
}

.stat{
  background:#fff;
  border:1px solid #e5e8ef;
  border-radius:17px;
  padding:20px;
}

.stat-title{
  color:#667085;
  font-size:13px;
}

.stat-value{
  font-size:25px;
  font-weight:900;
  margin-top:8px;
}

.dashboard-section{
  margin-top:20px;
}

.bonus-box{
  background:linear-gradient(135deg,#5b4bff,#7b6cff);
  color:#fff;
  border-radius:18px;
  padding:23px;
}

.bonus-box p{
  opacity:.9;
  margin-top:5px;
}

.bonus-box button{
  background:#fff;
  color:#5b4bff;
  border:0;
  padding:10px 15px;
  border-radius:9px;
  margin-top:15px;
  font-weight:800;
  cursor:pointer;
}

  border-radius:18px;
  padding:
