<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#080b16">
<meta name="description" content="EarnX - Complete tasks, earn rewards and withdraw your earnings.">
<title>EarnX — Earn Online</title>

<style>
*{
box-sizing:border-box;
margin:0;
padding:0
}

:root{
--bg:#060912;
--bg2:#0a1020;
--card:#10182a;
--card2:#151f34;
--border:rgba(255,255,255,.09);
--border2:#263653;
--text:#f5f7ff;
--muted:#8f9db7;
--primary:#7c5cff;
--primary2:#438cff;
--green:#20d99b;
--red:#ff5577;
--yellow:#ffc857;
--cyan:#35cfff;
--shadow:0 20px 60px rgba(0,0,0,.35);
--radius:20px
}

html{
scroll-behavior:smooth
}

body{
font-family:Arial,Helvetica,sans-serif;
background:
radial-gradient(circle at 5% -5%,rgba(124,92,255,.20),transparent 28%),
radial-gradient(circle at 100% 5%,rgba(67,140,255,.15),transparent 25%),
radial-gradient(circle at 50% 100%,rgba(32,217,155,.05),transparent 30%),
var(--bg);
color:var(--text);
min-height:100vh;
overflow-x:hidden
}

body:before{
content:"";
position:fixed;
inset:0;
pointer-events:none;
background-image:
linear-gradient(rgba(255,255,255,.012) 1px,transparent 1px),
linear-gradient(90deg,rgba(255,255,255,.012) 1px,transparent 1px);
background-size:40px 40px;
mask-image:linear-gradient(to bottom,#000,transparent 80%);
z-index:-1
}

button,
input,
select{
font:inherit
}

button{
cursor:pointer
}

a{
color:inherit;
text-decoration:none
}

/* HEADER */

header{
position:sticky;
top:0;
z-index:1000;
background:rgba(6,9,18,.82);
backdrop-filter:blur(20px);
-webkit-backdrop-filter:blur(20px);
border-bottom:1px solid rgba(255,255,255,.07)
}

.nav{
max-width:1200px;
margin:auto;
padding:13px 18px;
display:flex;
align-items:center;
justify-content:space-between;
gap:15px
}

.logo{
display:flex;
align-items:center;
gap:9px;
font-size:25px;
font-weight:1000;
letter-spacing:-1px;
background:linear-gradient(135deg,#a68cff,#5ba8ff);
-webkit-background-clip:text;
background-clip:text;
color:transparent;
white-space:nowrap
}

.logo:before{
content:"✦";
display:flex;
align-items:center;
justify-content:center;
width:34px;
height:34px;
border-radius:11px;
font-size:17px;
color:#fff;
background:linear-gradient(135deg,#7c5cff,#438cff);
box-shadow:0 8px 25px rgba(108,86,255,.35)
}

.nav-links{
display:flex;
gap:6px;
flex-wrap:wrap;
justify-content:flex-end
}

.nav-links button{
background:transparent;
border:1px solid transparent;
color:#aab6cc;
padding:9px 12px;
border-radius:11px;
font-weight:700;
transition:.2s
}

.nav-links button:hover{
color:#fff;
background:rgba(255,255,255,.06);
border-color:rgba(255,255,255,.08)
}

.nav-links button:last-child{
color:#ff718d
}

/* MAIN */

.container{
width:100%;
max-width:1200px;
margin:auto;
padding:25px 18px 55px
}

.page{
display:none;
animation:pageIn .3s ease
}

.page.active{
display:block
}

@keyframes pageIn{
from{
opacity:0;
transform:translateY(8px)
}
to{
opacity:1;
transform:translateY(0)
}
}

/* HERO */

.hero{
position:relative;
overflow:hidden;
margin-top:5px;
padding:78px 25px 72px;
text-align:center;
border:1px solid rgba(255,255,255,.10);
border-radius:30px;
background:
radial-gradient(circle at 50% 0%,rgba(124,92,255,.28),transparent 38%),
radial-gradient(circle at 10% 100%,rgba(67,140,255,.12),transparent 30%),
linear-gradient(145deg,#10182b,#090f1d);
box-shadow:var(--shadow)
}

.hero:before{
content:"";
position:absolute;
width:300px;
height:300px;
right:-140px;
top:-150px;
border-radius:50%;
background:rgba(124,92,255,.12);
filter:blur(5px)
}

.hero:after{
content:"";
position:absolute;
width:220px;
height:220px;
left:-110px;
bottom:-120px;
border-radius:50%;
background:rgba(67,140,255,.09);
filter:blur(4px)
}

.hero-content{
position:relative;
z-index:2
}

.hero-badge{
display:inline-flex;
align-items:center;
gap:7px;
padding:8px 13px;
border:1px solid rgba(124,92,255,.28);
border-radius:999px;
background:rgba(124,92,255,.09);
color:#b7a6ff;
font-size:12px;
font-weight:800;
margin-bottom:18px
}

.hero-badge span{
width:7px;
height:7px;
border-radius:50%;
background:var(--green);
box-shadow:0 0 12px var(--green)
}

.hero h1{
position:relative;
font-size:clamp(38px,7vw,64px);
line-height:1.05;
margin-bottom:18px;
font-weight:1000;
letter-spacing:-2px
}

.hero h1 span{
background:linear-gradient(90deg,#a58aff,#55a5ff);
-webkit-background-clip:text;
background-clip:text;
color:transparent
}

.hero p{
position:relative;
max-width:690px;
margin:auto;
color:var(--muted);
line-height:1.8;
font-size:16px
}

.hero-buttons{
display:flex;
justify-content:center;
gap:10px;
flex-wrap:wrap;
margin-top:27px
}

.btn{
border:0;
color:#fff;
padding:13px 21px;
border-radius:13px;
font-weight:900;
background:linear-gradient(135deg,var(--primary),var(--primary2));
box-shadow:0 12px 30px rgba(92,83,255,.27);
transition:.2s
}

.btn:hover{
transform:translateY(-2px);
filter:brightness(1.08)
}

.btn.secondary{
background:rgba(255,255,255,.055);
border:1px solid rgba(255,255,255,.10);
box-shadow:none
}

.hero .btn{
position:relative
}

/* MINI STATS */

.hero-stats{
position:relative;
z-index:2;
max-width:720px;
margin:35px auto 0;
display:grid;
grid-template-columns:repeat(3,1fr);
gap:10px
}

.hero-stat{
padding:13px;
border:1px solid rgba(255,255,255,.08);
background:rgba(255,255,255,.035);
border-radius:14px
}

.hero-stat strong{
display:block;
font-size:18px;
margin-bottom:4px
}

.hero-stat span{
font-size:11px;
color:var(--muted)
}

/* SECTION */

.section-title{
margin:45px 0 19px;
text-align:center;
font-size:28px;
font-weight:900
}

.section-subtitle{
text-align:center;
color:var(--muted);
font-size:14px;
margin-top:-11px;
margin-bottom:20px
}

/* CARDS */

.card{
background:
linear-gradient(145deg,rgba(20,31,51,.96),rgba(12,20,34,.96));
border:1px solid var(--border);
border-radius:var(--radius);
padding:22px;
box-shadow:0 15px 45px rgba(0,0,0,.20)
}

.card:hover{
border-color:rgba(124,92,255,.18)
}

/* FEATURES */

.features{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:15px
}

.feature{
text-align:center;
transition:.2s
}

.feature:hover{
transform:translateY(-3px)
}

.feature-icon{
width:60px;
height:60px;
margin:0 auto 14px;
display:flex;
align-items:center;
justify-content:center;
border-radius:18px;
background:
linear-gradient(145deg,#202d4a,#151f35);
font-size:29px;
border:1px solid #2b3b5c;
box-shadow:0 10px 25px rgba(0,0,0,.2)
}

.feature h3{
margin-bottom:7px;
font-size:16px
}

.feature p{
color:var(--muted);
font-size:13px;
line-height:1.6
}

/* TASKS */

.tasks{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:15px
}

.task{
display:flex;
align-items:center;
justify-content:space-between;
gap:15px;
padding:18px;
border-radius:18px;
background:
linear-gradient(145deg,#141f34,#0e1729);
border:1px solid var(--border);
transition:.2s
}

.task:hover{
transform:translateY(-2px);
border-color:rgba(124,92,255,.25)
}

.task-left{
display:flex;
align-items:center;
gap:13px;
min-width:0
}

.task-icon{
width:54px;
height:54px;
flex:0 0 54px;
display:flex;
align-items:center;
justify-content:center;
border-radius:16px;
font-size:27px;
background:linear-gradient(145deg,#202d49,#151f35);
border:1px solid #2b3b5c
}

.task h3{
font-size:16px;
margin-bottom:5px
}

.task p{
color:var(--muted);
font-size:13px
}

.reward{
color:var(--green);
font-weight:900;
text-align:right;
margin-bottom:8px
}

.small-btn{
border:0;
border-radius:10px;
padding:8px 12px;
color:#fff;
background:linear-gradient(135deg,var(--primary),var(--primary2));
font-weight:800;
transition:.2s
}

.small-btn:hover{
transform:translateY(-1px);
filter:brightness(1.08)
}

/* AUTH */

.auth-box{
max-width:480px;
margin:35px auto
}

.auth-box h2{
text-align:center;
margin-bottom:21px;
font-size:28px;
font-weight:900
}

.auth-box:before{
content:"EarnX";
display:block;
width:max-content;
margin:0 auto 12px;
padding:6px 11px;
border-radius:999px;
font-size:11px;
font-weight:900;
letter-spacing:.5px;
color:#bbaeff;
background:rgba(124,92,255,.10);
border:1px solid rgba(124,92,255,.18)
}

.form-group{
margin-bottom:15px
}

.form-group label{
display:block;
margin-bottom:7px;
color:#cbd6e9;
font-size:13
