<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EarnX - Earn Online</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

:root{
  --bg:#050816;
  --bg2:#0a1022;
  --card:#10182c;
  --card2:#141d35;
  --text:#f8fafc;
  --muted:#94a3b8;
  --purple:#8b5cf6;
  --blue:#3b82f6;
  --cyan:#06b6d4;
  --green:#22c55e;
  --yellow:#f59e0b;
  --red:#ef4444;
  --pink:#ec4899;
  --border:rgba(255,255,255,.09);
}

body{
  font-family:Arial,Helvetica,sans-serif;
  color:var(--text);
  min-height:100vh;
  background:
    radial-gradient(circle at 5% 5%,rgba(139,92,246,.22),transparent 28%),
    radial-gradient(circle at 95% 15%,rgba(37,99,235,.18),transparent 28%),
    linear-gradient(135deg,var(--bg),var(--bg2));
}

button,input,select{font:inherit}
button{cursor:pointer}
a{text-decoration:none;color:inherit}

.container{width:min(1120px,92%);margin:auto}
.hidden{display:none!important}

header{
  position:sticky;
  top:0;
  z-index:100;
  background:rgba(5,8,22,.82);
  backdrop-filter:blur(18px);
  border-bottom:1px solid var(--border);
}

.nav{
  min-height:70px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  display:flex;
  align-items:center;
  gap:10px;
  font-size:24px;
  font-weight:900;
}

.logo-icon{
  width:42px;
  height:42px;
  display:grid;
  place-items:center;
  border-radius:14px;
  background:linear-gradient(135deg,#8b5cf6,#2563eb);
  box-shadow:0 0 30px rgba(99,102,241,.45);
}

.logo span{
  background:linear-gradient(90deg,#c4b5fd,#60a5fa,#22d3ee);
  -webkit-background-clip:text;
  color:transparent;
}

.nav-links{
  display:flex;
  gap:7px;
}

.nav-links button{
  color:#dbe4f5;
  background:transparent;
  border:0;
  padding:10px 14px;
  border-radius:10px;
}

.nav-links button:hover{
  background:rgba(255,255,255,.07);
}

.mobile-menu{
  display:none;
  color:white;
  background:rgba(255,255,255,.06);
  border:1px solid var(--border);
  border-radius:10px;
  padding:9px 12px;
}

section{padding:65px 0}

/* HERO */

.hero{padding:80px 0 50px}

.hero-grid{
  display:grid;
  grid-template-columns:1.15fr .85fr;
  gap:35px;
  align-items:center;
}

.badge{
  display:inline-block;
  padding:8px 14px;
  border-radius:30px;
  color:#c4b5fd;
  background:rgba(139,92,246,.13);
  border:1px solid rgba(139,92,246,.3);
  font-size:13px;
  margin-bottom:18px;
}

.hero h1{
  font-size:clamp(44px,7vw,76px);
  line-height:.98;
  letter-spacing:-3px;
  margin-bottom:22px;
}

.gradient-text{
  background:linear-gradient(90deg,#a78bfa,#60a5fa,#22d3ee);
  -webkit-background-clip:text;
  color:transparent;
}

.hero p{
  color:var(--muted);
  font-size:17px;
  line-height:1.7;
  max-width:620px;
}

.hero-buttons{
  display:flex;
  gap:12px;
  margin-top:28px;
  flex-wrap:wrap;
}

.btn{
  border:0;
  border-radius:13px;
  padding:13px 20px;
  color:white;
  font-weight:800;
}

.btn-primary{
  background:linear-gradient(135deg,#8b5cf6,#2563eb);
  box-shadow:0 10px 30px rgba(79,70,229,.28);
}

.btn-secondary{
  background:rgba(255,255,255,.06);
  border:1px solid var(--border);
}

.full{width:100%}

/* HERO CARD */

.hero-card{
  position:relative;
  overflow:hidden;
  padding:28px;
  border-radius:28px;
  background:
    linear-gradient(145deg,rgba(139,92,246,.17),rgba(37,99,235,.07)),
    rgba(10,16,32,.9);
  border:1px solid rgba(139,92,246,.25);
  box-shadow:0 25px 80px rgba(0,0,0,.35);
}

.earn-label{color:var(--muted)}
.big-money{
  font-size:48px;
  font-weight:900;
  margin:8px 0 22px;
}

.mini-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.mini-card{
  padding:16px;
  border-radius:16px;
  background:rgba(255,255,255,.045);
  border:1px solid var(--border);
}

.mini-card small{
  display:block;
  color:var(--muted);
  margin-top:5px;
}

.mini-card strong{
  display:block;
  font-size:20px;
  margin-top:4px;
}

/* TITLES */

.section-title{
  text-align:center;
  margin-bottom:35px;
}

.section-title h2{
  font-size:34px;
  margin-bottom:10px;
}

.section-title p{color:var(--muted)}

/* FEATURES */

.features{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
}

.feature{
  padding:23px;
  border-radius:20px;
  background:rgba(16,24,44,.84);
  border:1px solid var(--border);
}

.feature-icon{
  font-size:30px;
  margin-bottom:14px;
}

.feature h3{margin-bottom:8px}
.feature p{
  color:var(--muted);
  line-height:1.5;
  font-size:14px;
}

/* TASKS */

.tasks-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:17px;
}

.task{
  position:relative;
  overflow:hidden;
  padding:22px;
  border-radius:22px;
  background:linear-gradient(145deg,rgba(17,25,47,.96),rgba(9,14,29,.96));
  border:1px solid var(--border);
}

.task:before{
  content:"";
  position:absolute;
  width:100px;
  height:100px;
  border-radius:50%;
  right:-35px;
  top:-35px;
  filter:blur(45px);
  opacity:.35;
}

.task.telegram:before{background:#229ed9}
.task.youtube:before{background:#ff0000}
.task.instagram:before{background:#e1306c}
.task.tiktok:before{background:#25f4ee}
.task.website:before{background:#8b5cf6}

.task-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}

.task-left{
  display:flex;
  align-items:center;
  gap:13px;
}

.task-icon{
  width:54px;
  height:54px;
  flex-shrink:0;
  display:grid;
  place-items:center;
  border-radius:16px;
  font-size:27px;
  background:rgba(255,255,255,.07);
  border:1px solid var(--border);
}

.task h3{margin-bottom:5px}
.task p{
  color:var(--muted);
  font-size:13px;
}

.reward{
  color:#86efac;
  font-weight:900;
  white-space:nowrap;
}

.task-btn{
  width:100
