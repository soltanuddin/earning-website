<script type="module">

let registerMode = false;

const modal = document.getElementById("authModal");
const loginBtn = document.getElementById("loginBtn");
const getStarted = document.getElementById("getStarted");
const closeModal = document.getElementById("closeModal");
const switchAuth = document.getElementById("switchAuth");
const switchText = document.getElementById("switchText");
const authTitle = document.getElementById("authTitle");
const nameGroup = document.getElementById("nameGroup");
const continueBtn = document.getElementById("continueBtn");
const dashboard = document.getElementById("dashboard");

function openModal() {
  modal.style.display = "flex";
}

function updateAuth() {
  if (registerMode) {
    authTitle.textContent = "Create Account";
    nameGroup.style.display = "block";
    switchText.textContent = "Already have an account?";
    switchAuth.textContent = "Login";
    continueBtn.textContent = "Create Account";
  } else {
    authTitle.textContent = "Login";
    nameGroup.style.display = "none";
    switchText.textContent = "Don't have an account?";
    switchAuth.textContent = "Register";
    continueBtn.textContent = "Login";
  }
}

loginBtn.addEventListener("click", function() {
  registerMode = false;
  updateAuth();
  openModal();
});

getStarted.addEventListener("click", function() {
  registerMode = true;
  updateAuth();
  openModal();
});

closeModal.addEventListener("click", function() {
  modal.style.display = "none";
});

switchAuth.addEventListener("click", function() {
  registerMode = !registerMode;
  updateAuth();
});

modal.addEventListener("click", function(e) {
  if (e.target === modal) {
    modal.style.display = "none";
  }
});

continueBtn.addEventListener("click", async function() {

  const name = document.getElementById("name").value.trim();
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  if (!email || !password) {
    alert("Please enter your email and password.");
    return;
  }

  if (registerMode && !name) {
    alert("Please enter your full name.");
    return;
  }

  continueBtn.disabled = true;
  continueBtn.textContent = "Please wait...";

  try {

    const endpoint = registerMode
      ? "/api/register"
      : "/api/login";

    const data = registerMode
      ? { name, email, password }
      : { email, password };

    const response = await fetch(endpoint, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify(data)
    });

    const result = await response.json();

    if (!response.ok || !result.success) {
      alert(result.message || "Something went wrong.");
      return;
    }

    alert(
      registerMode
        ? "Account created successfully!"
        : "Login successful!"
    );

    modal.style.display = "none";
    dashboard.style.display = "block";

    dashboard.scrollIntoView({
      behavior: "smooth"
    });

  } catch (error) {
    alert("Connection error. Please try again.");
  } finally {
    continueBtn.disabled = false;
    updateAuth();
  }

});

updateAuth();

</script>
